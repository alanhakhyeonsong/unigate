spring:
  # --- Valkey (로컬 Sentinel: docker-compose) ---
  data:
    redis:
      sentinel:
        master: ${VALKEY_SENTINEL_MASTER:mymaster}
        nodes: ${VALKEY_SENTINEL_NODES:127.0.0.1:26379}
      # password: ${VALKEY_PASSWORD:}   # 로컬은 미설정
  session:
    store-type: redis
    timeout: 30m

  # --- R2DBC (런타임, reactive) ---
  # 로컬 postgres 는 호스트 3000 포트로 노출된다 (docker-compose.yml)
  r2dbc:
    url: ${SPRING_R2DBC_URL:r2dbc:postgresql://127.0.0.1:3000/unigate}
    username: ${SPRING_R2DBC_USERNAME:testuser}
    password: ${SPRING_R2DBC_PASSWORD:testpass}

  # --- Flyway (마이그레이션, JDBC) ---
  flyway:
    enabled: true
    url: ${SPRING_FLYWAY_URL:jdbc:postgresql://127.0.0.1:3000/unigate}
    user: ${SPRING_FLYWAY_USER:testuser}
    password: ${SPRING_FLYWAY_PASSWORD:testpass}
    locations: classpath:db/migration

  # --- Keycloak (인스턴스 공유 · realm 격리: local=test / alpha=unigate) ---
  # 실제 issuer 는 KEYCLOAK_ISSUER_URI 로 주입한다. (docs/KEYCLOAK_REALM_SETUP.md)
  #   source ./keycloak.secret.env   # gitignore 대상
  security:
    oauth2:
      client:
        provider:
          keycloak:
            issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/test}
        registration:
          keycloak:
            provider: keycloak
            client-id: ${KEYCLOAK_OAUTH_CLIENT_ID:unigate-client}
            client-secret: ${KEYCLOAK_OAUTH_CLIENT_SECRET:changeit}
            authorization-grant-type: authorization_code
            scope: openid, profile, email

logging:
  level:
    me.ramos.unigate: DEBUG
    # 4xx 를 보기 위해 켠다.
    # AbstractErrorWebExceptionHandler 는 5xx 만 ERROR 로 남기고 4xx 는 DEBUG 로 남긴다.
    # 게이트웨이에서 404 는 대개 "라우트 Predicate 에 안 걸렸다"는 신호이므로,
    # 기본 레벨(INFO)로 두면 라우팅 오류가 무음으로 묻힌다.
    # (docs/learning/01-scg-route-and-filter-chain.md §5)
    org.springframework.boot.autoconfigure.web.reactive.error: DEBUG
