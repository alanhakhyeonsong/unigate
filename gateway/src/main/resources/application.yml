spring:
  application:
    name: unigate
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  # 게이트웨이는 루트에서 서빙 (context-path 없음)
  main:
    web-application-type: reactive

server:
  shutdown: graceful
  port: 8080

unigate:
  downstream:
    # Phase 1 검증용 샘플 다운스트림(samples/downstream-demo, 커밋 제외).
    # 환경별로 실제 백엔드 주소로 교체된다.
    demo-uri: ${DOWNSTREAM_DEMO_URI:http://localhost:8081}
  keycloak:
    # Phase 2 TokenVerifier(JWKS 로컬 검증)용. 실제 issuer 는 KEYCLOAK_ISSUER_URI 로 주입한다.
    # 디코더는 지연 로딩이라 이 값이 부팅을 막지 않는다(첫 검증 시점에 JWKS 조회).
    issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/test}
    # 이 게이트웨이가 검증 시 기대하는 audience. 소비자가 정해지는 시점(P8/9)에 확정한다.
    expected-audience: ${TOKEN_VERIFIER_EXPECTED_AUDIENCE:unigate-downstream-demo}
  ratelimit:
    # Phase 3 토큰버킷(RedisRateLimiter). 로컬 검증이 쉬우라고 낮게 잡는다 — 운영값은 환경별 조정.
    replenish-rate: ${RATELIMIT_REPLENISH_RATE:5}   # 초당 보충 토큰(정상 지속 처리율)
    burst-capacity: ${RATELIMIT_BURST_CAPACITY:10}  # 버킷 최대(순간 버스트 허용)
    requested-tokens: ${RATELIMIT_REQUESTED_TOKENS:1}

# Phase 3 Resilience — 다운스트림 호출 Circuit Breaker + Timeout.
resilience4j:
  circuitbreaker:
    instances:
      downstream:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10               # 최근 10건으로 실패율 판단
        minimum-number-of-calls: 5            # 최소 5건은 모여야 회로 판단 시작
        failure-rate-threshold: 50            # 실패율 50% 초과 시 open
        wait-duration-in-open-state: 10s      # open 유지 시간(이후 half-open 시도)
        permitted-number-of-calls-in-half-open-state: 3
  timelimiter:
    instances:
      downstream:
        timeout-duration: 2s                  # 다운스트림 2초 초과 시 실패 처리 → fallback
        cancel-running-future: true

# graceful shutdown drain 시간
lifecycle:
  timeout-per-shutdown-phase: 20s

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      probes:
        enabled: true       # /actuator/health/readiness, /actuator/health/liveness
      group:
        readiness:
          include: readinessState, redis
  metrics:
    tags:
      application: ${spring.application.name}

# Flyway: 스키마 마이그레이션(JDBC, 부팅 시 1회). 런타임 CRUD 는 R2DBC.
# R2DBC 는 마이그레이션 기능이 없어 Flyway 를 JDBC 로 별도 구동한다.
