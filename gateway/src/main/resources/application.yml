spring:
  application:
    name: unigate
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  # 게이트웨이는 루트에서 서빙 (context-path 없음)
  main:
    web-application-type: reactive

  # ── Phase 4: Reactor 자동 컨텍스트 전파 ────────────────────────────────
  # Servlet 은 요청당 스레드라 traceId 를 ThreadLocal(MDC)에 넣으면 요청 내내 유지됐다.
  # WebFlux 는 연산자마다 스레드가 바뀌므로 MDC 가 그냥은 따라다니지 않는다
  # → 로그에 traceId 가 **비거나 남의 요청 것이 찍힌다**.
  #
  # 기본값은 `limited` 로, `.handle()`/`.tap()` 같은 일부 연산자에서만 ThreadLocal 을 복원한다.
  # `auto` 는 Reactor 의 Hooks.enableAutomaticContextPropagation() 을 켜서 모든 연산자 경계에서
  # 복원한다. 대가는 연산자마다 붙는 복원 비용이므로 공짜가 아니다.
  reactor:
    context-propagation: auto

  # ── Phase 4: RFC 9457(구 7807) Problem Detail ─────────────────────────
  # 기본값이 false 라 켜지 않으면 502/504 가 Spring 기본 에러 본문(JSON: timestamp/path/status)으로 나간다.
  # 켜면 ResponseStatusException 계열이 application/problem+json 으로 렌더링돼
  # CB fallback(FallbackRoutes)·인증 실패(ProblemDetailAuthenticationHandlers)와 형식이 하나로 맞는다.
  webflux:
    problemdetails:
      enabled: true

server:
  shutdown: graceful
  port: 8080

unigate:
  # ── FE 착지 주소 (로그인/로그아웃 이후) ──────────────────────────────────
  # **비워두는 것이 기본이다.** 비면 로그인은 `/`, 로그아웃은 `{baseUrl}/` 로 가는데,
  # 이는 FE 와 게이트웨이가 같은 origin 인 배포(로컬 Vite dev proxy)에서 정확히 맞는 동작이다.
  #
  # FE 를 **다른 호스트**에 두는 배포에서만 채운다. 안 채우면 로그인·로그아웃 후 게이트웨이 루트로
  # 가는데 거기엔 FE 가 없어 401 이 뜬다. 로그인 자체는 성공한 뒤라 원인이 Keycloak 으로
  # 오해되기 쉽다 — Keycloak 의 redirectUris 는 **인가 코드 배달 주소**일 뿐 착지가 아니다.
  #
  # ⚠️ 여기에 넣는 값은 Keycloak client 의 `post.logout.redirect.uris` 에도 등록돼 있어야 한다
  #    (`setup-realm.sh --console-host <fe-host>` 가 추가한다). 없으면 로그아웃이
  #    `invalid_redirect_uri` 로 거절되는데 증상은 "로그아웃이 안 된다" 로만 보인다.
  #
  # 실제 호스트는 커밋 대상에 넣지 않는다(CLAUDE.md §8) — 환경변수로만 주입한다.
  frontend:
    base-uri: ${UNIGATE_FRONTEND_BASE_URI:}
  downstream:
    # Phase 1 검증용 샘플 다운스트림(samples/downstream-demo).
    # 환경별로 실제 백엔드 주소로 교체된다.
    demo-uri: ${DOWNSTREAM_DEMO_URI:http://localhost:8081}
    # **2대째** 다운스트림(samples/downstream-billing). 제품이 여럿일 때만 드러나는 것들을
    # 재현하기 위한 것이다 — 공유 aud 재생 · claim 누출 · 교차 테넌트 판정 · CB 격리.
    #
    # 이 기본값은 **로컬 전용**이다. alpha 는 `application-alpha.yml` 이 같은 키를 재선언해
    # fallback 없이 `${DOWNSTREAM_BILLING_URI}` 를 요구하므로, 주입을 빠뜨리면 기동이 실패한다.
    # (로컬 기본값이 alpha 에 새면 파드가 자기 자신을 찌르며 503 을 내고, 그 증상은
    #  "billing 이 안 떴다" 와 구별되지 않는다.)
    billing-uri: ${DOWNSTREAM_BILLING_URI:http://localhost:8082}
  iam:
    # Phase 8f — IAM 서비스(별도 모듈, Servlet MVC + JPA + VT). 로컬 기본 포트는 8090.
    # 게이트웨이 입장에서는 그냥 또 하나의 프록시 대상이다(IAM_PLATFORM_DECISION.md D4 모델 A).
    uri: ${IAM_URI:http://localhost:8090}
  keycloak:
    # Phase 2 TokenVerifier(JWKS 로컬 검증)용. 실제 issuer 는 KEYCLOAK_ISSUER_URI 로 주입한다.
    # 디코더는 지연 로딩이라 이 값이 부팅을 막지 않는다(첫 검증 시점에 JWKS 조회).
    issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/test}
    # 이 게이트웨이가 검증 시 기대하는 audience. 소비자가 정해지는 시점(P8/9)에 확정한다.
    expected-audience: ${TOKEN_VERIFIER_EXPECTED_AUDIENCE:unigate-downstream-demo}
  ratelimit:
    # Phase 3 토큰버킷(RedisRateLimiter). 로컬 검증이 쉬우라고 낮게 잡는다 — 운영값은 환경별 조정.
    replenish-rate: ${RATELIMIT_REPLENISH_RATE:5}   # 초당 보충 토큰(정상 지속 처리율)
    burst-capacity: ${RATELIMIT_BURST_CAPACITY:10}  # 버킷 최대(순간 버스트 허용)
    requested-tokens: ${RATELIMIT_REQUESTED_TOKENS:1}
    # Phase 8f — 가입(POST /iam/register) 전용. 미인증 공개 쓰기 엔드포인트라 훨씬 엄격하다.
    # replenish-rate 가 Int 라 "초당 1회 미만"을 직접 못 쓴다 → requested-tokens 를 키워 표현한다.
    #   1토큰/초 보충 · 요청당 5토큰 소비  ⇒ 지속 분당 12회
    #   버킷 15토큰                        ⇒ 연속 3건까지 즉시 허용
    # ⚠️ burst-capacity < requested-tokens 로 두면 모든 가입이 429 다(RateLimitConfig 가 부팅 시 거부).
    register:
      replenish-rate: ${RATELIMIT_REGISTER_REPLENISH_RATE:1}
      burst-capacity: ${RATELIMIT_REGISTER_BURST_CAPACITY:15}
      requested-tokens: ${RATELIMIT_REGISTER_REQUESTED_TOKENS:5}

# Phase 3 Resilience — 다운스트림 호출 Circuit Breaker + Timeout.
resilience4j:
  circuitbreaker:
    instances:
      downstream:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10               # 최근 10건으로 실패율 판단
        minimum-number-of-calls: 5            # 최소 5건은 모여야 회로 판단 시작
        failure-rate-threshold: 50            # 실패율 50% 초과 시 open
        wait-duration-in-open-state: 10s      # open 유지 시간(이후 half-open 시도)
        permitted-number-of-calls-in-half-open-state: 3
      # 2대째 다운스트림도 **자기 회로를 갖는다.** 위 `iam` 과 같은 원칙이지만, 여기서 비로소
      # 원칙이 실측 가능해진다 — billing 을 죽였을 때 demo 가 계속 200 을 주는지 눈으로 본다.
      # (같은 인스턴스를 공유했다면 청구 장애가 주문 API 까지 끊는다. `paas-iam-scope-review.md`
      #  §11 F13 주변에서 말한 bulkhead 의 실체가 이것이다.)
      billing:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
      # Phase 8f — IAM 은 **회로를 따로 둔다.** 같은 인스턴스를 공유하면 제품 다운스트림 장애가
      # IAM 회로까지 열어 가입·프로필이 함께 죽는다(장애 격리 실패). 서비스별 CB 가 원칙이다.
      iam:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
  timelimiter:
    instances:
      downstream:
        timeout-duration: 2s                  # 다운스트림 2초 초과 시 실패 처리 → fallback
        cancel-running-future: true
      billing:
        timeout-duration: 2s
        cancel-running-future: true
      # IAM 은 2초로 잡으면 위험하다. 가입 1건이 Keycloak Admin 왕복(service account 토큰 발급이
      # 캐시 미스면 2회)을 포함하고, VT 라 느린 요청이 스레드를 잡아먹지도 않는다.
      # 게이트웨이가 먼저 끊으면 IAM 은 계속 처리해 **사용자에겐 실패인데 계정은 생기는** 상태가 된다.
      iam:
        timeout-duration: 5s
        cancel-running-future: true

# graceful shutdown drain 시간
lifecycle:
  timeout-per-shutdown-phase: 20s

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      probes:
        enabled: true       # /actuator/health/readiness, /actuator/health/liveness
      group:
        readiness:
          include: readinessState, redis
  metrics:
    tags:
      application: ${spring.application.name}

  # ── Phase 4: 분산 트레이싱 ──────────────────────────────────────────────
  # exporter 는 붙이지 않았다(수집 백엔드는 Phase 6). 지금 얻는 것은 세 가지다:
  #   ① traceId/spanId 생성  ② 다운스트림으로 traceparent 전파(SCG 가 자동 수행)
  #   ③ 로그·감사로그 상관관계
  #
  # ⚠️ 샘플링은 "저장 여부"가 아니라 **span 을 만들지 여부**다. 샘플링에서 빠진 요청은
  # traceId 자체가 로그에 남지 않아 사후 추적이 불가능해진다. 그래서 감사·보안 목적이 큰
  # 게이트웨이에서는 기본값 0.1(10%)을 그대로 쓰지 않고 환경별로 정한다.
  # 운영에서 1.0 은 비용(수집·저장)이 크므로 Phase 6 에서 백엔드와 함께 조정한다.
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
    propagation:
      # 나갈 때 쓰는 형식. 기본값도 W3C 지만, 다운스트림과의 계약이라 명시해 고정한다.
      produce: W3C
      # 받을 때는 W3C 와 B3 계열을 모두 허용한다(기본값). 아직 B3 만 쓰는 레거시 클라이언트가
      # 붙어도 trace 가 끊기지 않게 하기 위함이다.
      consume: W3C,B3,B3_MULTI

# Flyway: 스키마 마이그레이션(JDBC, 부팅 시 1회). 런타임 CRUD 는 R2DBC.
# R2DBC 는 마이그레이션 기능이 없어 Flyway 를 JDBC 로 별도 구동한다.
