# alpha 환경 — 공유 자원(Valkey/PostgreSQL/Keycloak) 접속.
# 민감값은 Helm secret(envFrom)으로 주입되며 이 파일엔 평문 secret 을 두지 않는다.
spring:
  data:
    redis:
      sentinel:
        master: ${VALKEY_SENTINEL_MASTER}
        nodes: ${VALKEY_SENTINEL_NODES}
      password: ${VALKEY_PASSWORD}
  session:
    store-type: redis
    timeout: 30m

  r2dbc:
    url: ${SPRING_R2DBC_URL}
    username: ${SPRING_R2DBC_USERNAME}
    password: ${SPRING_R2DBC_PASSWORD}

  flyway:
    enabled: true
    url: ${SPRING_FLYWAY_URL}
    user: ${SPRING_FLYWAY_USER}
    password: ${SPRING_FLYWAY_PASSWORD}
    locations: classpath:db/migration

  security:
    oauth2:
      client:
        provider:
          keycloak:
            issuer-uri: ${KEYCLOAK_ISSUER_URI}
        registration:
          keycloak:
            provider: keycloak
            client-id: ${KEYCLOAK_OAUTH_CLIENT_ID}
            client-secret: ${KEYCLOAK_OAUTH_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            scope: openid, profile, email

# FE 콘솔이 게이트웨이와 **다른 호스트**에 있으므로 CORS 가 필요하다.
# 실제 좌표는 넣지 않는다(CLAUDE.md §8) — Helm values 로 주입한다.
# 값 형식: 스킴+호스트(+포트). 끝 슬래시·경로를 붙이면 Origin 헤더와 문자열이 달라 조용히 실패한다.
unigate:
  cors:
    allowed-origins: ${UNIGATE_CORS_ALLOWED_ORIGINS:}

  # 다운스트림·IAM 라우트 대상.
  #
  # ⚠️ 공통 `application.yml` 에는 localhost fallback 이 있지만, **여기서 fallback 없이
  # 재선언해 그것을 덮는다.** 프로파일별 파일이 이기므로 alpha 에서는 주입이 빠지면
  # placeholder 미해결로 **기동이 실패한다** — 자기 파드의 localhost 를 찌르며 502 를 내는
  # 것보다 빨리 죽는 편이 낫다(`application-alpha.yml`(iam) 과 같은 판단).
  #
  # k8s 에서는 **같은 네임스페이스의 짧은 Service 이름**을 주입한다(`http://unigate-iam-svc`).
  # FQDN 을 쓰면 네임스페이스가 값에 박혀 실제 좌표가 배포 파일에 남는다.
  downstream:
    demo-uri: ${DOWNSTREAM_DEMO_URI}
    # 2대째 다운스트림. **여기도 fallback 을 두지 않는다** — 로컬 기본값(`localhost:8082`)이
    # alpha 에 새면 파드가 자기 자신을 찌르며 CB open 으로 503 을 내고, 그 증상은
    # "billing 이 안 뜬 것" 과 구별되지 않는다. 주입이 없으면 기동이 실패하는 편이 낫다.
    billing-uri: ${DOWNSTREAM_BILLING_URI}
  iam:
    uri: ${IAM_URI}

logging:
  level:
    me.ramos.unigate: INFO
