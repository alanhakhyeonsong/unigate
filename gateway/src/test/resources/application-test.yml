# Phase 1 마감(Step 9) — 게이트웨이를 Keycloak·DB·Valkey 없이 부팅하기 위한 테스트 프로파일.
#
# 목적: SecurityConfig 의 인가 경계(공개 경로 / 미인증 리다이렉트 / PKCE)를 오프라인으로 회귀 고정.
# 로그인을 "완료"하지 않고 리다이렉트 시작까지만 검증하므로 실제 IdP·다운스트림 호출이 없다.
#
# issuer-uri(discovery)를 쓰면 부팅 시 Keycloak 에 접속해 엔드포인트를 받아온다 → 오프라인 불가.
# 그래서 provider 엔드포인트를 **정적으로** 박아 discovery 자체를 없앤다. 존재하지 않는 포트(:1)를
# 가리켜 두며, 이 테스트들에선 실제로 호출되지 않는다(mock 서버조차 띄울 필요 없음).
spring:
  # DB(R2DBC/Flyway/DataSource)·Session 자동구성은 이 슬라이스의 관심사가 아니고 외부 의존이라
  # 부팅을 막는다. r2dbc/datasource 는 URL 이 없으면 기동 자체가 실패하므로 반드시 제외한다.
  #
  # ⚠️ Redis(reactive)는 제외하지 않는다(Phase 3): RedisRateLimiter 가 ReactiveRedisTemplate 빈을
  # 요구하기 때문. Lettuce 연결은 지연 초기화라 부팅 시 실제 접속하지 않고, 미인증 /api 요청은
  # 라우팅 전에 302 로 막혀 rate limiter 필터가 돌지 않으므로 이 테스트에서 redis 접속은 없다.
  # 대신 redis health 기여자만 꺼 health 200 을 지킨다(아래 management.health.redis.enabled=false).
  #
  # ⚠️ R2DBC 도 제외하지 않는다(Phase 4): R2dbcAuditLogAdapter 가 DatabaseClient 빈을 요구한다.
  # dummy URL + pool.initial-size=0 으로 커넥션 팩토리만 만들고 부팅 시 접속하지 않는다. 감사 저장은
  # 로그인 시점에만 일어나는데 이 테스트들은 로그인을 완료하지 않으므로 실제 DB 접속이 없다.
  # (JDBC 계열 DataSource/Flyway 는 여전히 제외 — 이 테스트에 불필요.)
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration
      - org.springframework.boot.autoconfigure.session.SessionAutoConfiguration
  r2dbc:
    # 접속하지 않는 dummy 좌표. initial-size=0 이라 부팅 시 커넥션을 만들지 않는다.
    url: r2dbc:postgresql://localhost:5432/unigate_test
    username: test
    password: test
    pool:
      initial-size: 0
      max-size: 1
  security:
    oauth2:
      client:
        registration:
          keycloak:
            provider: keycloak
            client-id: test-client
            client-secret: test-secret
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/keycloak"
            scope: openid,profile,email
        provider:
          keycloak:
            # 정적 엔드포인트 — discovery 없이 ClientRegistration 을 구성한다. 실제 호출은 없다.
            authorization-uri: http://localhost:1/realms/test/protocol/openid-connect/auth
            token-uri: http://localhost:1/realms/test/protocol/openid-connect/token
            jwk-set-uri: http://localhost:1/realms/test/protocol/openid-connect/certs
            user-info-uri: http://localhost:1/realms/test/protocol/openid-connect/userinfo
            user-name-attribute: preferred_username

# redis 는 autoconfig 를 살렸지만(RedisRateLimiter 때문) 실제 접속은 없으므로 health ping 은 끈다
# → /actuator/health 가 redis DOWN 으로 503 이 되는 것을 막는다. readiness 그룹도 readinessState 만.
management:
  health:
    redis:
      enabled: false
    # R2DBC 도 dummy 좌표라 health ping 이 DOWN → health 503 이 된다. 끈다(Phase 4).
    r2dbc:
      enabled: false
  endpoint:
    health:
      group:
        readiness:
          include: readinessState

# 라우트 대상.
# demo-uri 는 실제 프록시가 발생하지 않는다 — 미인증 /api 는 라우팅 전에 차단되기 때문.
# 반면 iam.uri 는 **실제로 호출된다**: /iam/register 는 공개 경로라 security 를 통과해 라우팅까지
# 도달한다. 존재하지 않는 :1 이라 연결이 실패하고, CB fallback 이 503 을 돌려준다 —
# 그 503 자체가 "security 를 통과해 iam 라우트로 갔다"는 증거다(401 이었다면 막힌 것).
unigate:
  downstream:
    demo-uri: http://localhost:1
  iam:
    uri: http://localhost:1
