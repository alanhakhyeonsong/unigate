# 기본값 (안전 default). 환경별 배포는 values-<env>.yaml 오버레이로 덮어쓴다.
global:
  name: unigate
  namespace: ""
  image:
    repository: <container-registry>/unigate
    tag: "latest"
    pullPolicy: IfNotPresent

replicaCount: 1
terminationGracePeriodSeconds: 45
revisionHistoryLimit: 3
imagePullSecrets: []

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

serviceAccount:
  create: true
  annotations: {}
  name: ""
  automount: null

podAnnotations: {}
podLabels:
  app: unigate

podSecurityContext:
  fsGroup: 1001
  fsGroupChangePolicy: OnRootMismatch

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  privileged: false
  readOnlyRootFilesystem: true
  runAsGroup: 1001
  runAsNonRoot: true
  runAsUser: 1001
  seccompProfile:
    type: RuntimeDefault

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

resources:
  requests:
    cpu: 250m
    memory: 1Gi
  limits:
    cpu: 500m
    memory: 2Gi

startupProbe:
  httpGet:
    path: /actuator/health/readiness
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10
  failureThreshold: 24

livenessProbe:
  httpGet:
    path: /actuator/health/liveness
    port: http
  periodSeconds: 30
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /actuator/health/readiness
    port: http
  periodSeconds: 15

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: null

ingress:
  enabled: false

javaOpts: "-Xms512m -Xmx1280m"

otelAgent:
  enabled: false

env:
  # 기본값 없음(fail-closed). 환경별 오버레이(values-<env>.yaml)에서 반드시 지정한다.
  # local 을 기본값으로 두면 오버레이를 빠뜨린 배포가 조용히 성공하면서
  # 개발용 자격증명과 디버그 엔드포인트가 그대로 노출된다.
  SPRING_PROFILES_ACTIVE: ""

tmpVolume:
  enabled: true
  mountPath: /app/tmp
  persistentVolumeClaim:
    create: true
    accessModes:
      - ReadWriteOnce
    resources:
      requests:
        storage: 1Gi

config:
  enabled: false

secrets:
  enabled: false
  data: {}

nodeSelector: {}
tolerations: []
affinity: {}
