{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ default (include "unigate.fullname" .) .Values.serviceAccount.name }}-sa
  namespace: {{ include "unigate.namespace" . }}
  labels:
    {{- include "unigate.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- with .Values.serviceAccount.automount }}
automountServiceAccountToken: {{ . }}
{{- end }}
{{- end }}
