{{- $secrets := .Values.secrets -}}
{{- if and $secrets $secrets.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "unigate.fullname" . }}-secret
  namespace: {{ include "unigate.namespace" . }}
  labels:
    {{- include "unigate.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := $secrets.data }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
