# alpha 환경 (공유 k8s / Valkey / PostgreSQL / Keycloak)
# 비민감 설정만 포함. 민감값(secrets.data)은 values-alpha.secret.yaml(gitignore) 로 분리 주입.
# 배포: helm upgrade --install unigate deploy/helm/unigate \
#        -f values-alpha.yaml -f values-alpha.secret.yaml --set global.image.tag=<TAG>

# TODO: 아래 환경 좌표(namespace / image repo / ingress host)는 미확정 placeholder.
#       실제 배포 대상 확정 시 교체한다.
global:
  name: unigate
  namespace: unigate                  # 배포 네임스페이스 (확정 필요)
  image:
    repository: <container-registry>/unigate
    # 'tag' 는 배포 시 --set global.image.tag 로 주입 (deploy-alpha.sh)
    tag: "latest"
    pullPolicy: IfNotPresent

replicaCount: 1

terminationGracePeriodSeconds: 45

lifecycle:
  preStop:
    exec:
      command: ["sh", "-c", "sleep 5"]

revisionHistoryLimit: 3

imagePullSecrets:
  - name: harbor-pull

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

serviceAccount:
  create: true
  annotations: {}
  name: ""
  automount: null

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/path: "/actuator/prometheus"
  prometheus.io/port: "8080"
podLabels:
  app: unigate

podSecurityContext:
  fsGroup: 1001
  fsGroupChangePolicy: OnRootMismatch

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  privileged: false
  readOnlyRootFilesystem: true
  runAsGroup: 1001
  runAsNonRoot: true
  runAsUser: 1001
  seccompProfile:
    type: RuntimeDefault

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

resources:
  requests:
    cpu: 250m
    memory: 1Gi
  limits:
    cpu: 500m
    memory: 2Gi

# 게이트웨이는 루트 서빙 → context-path 없음
startupProbe:
  httpGet:
    path: /actuator/health/readiness
    port: http
    scheme: HTTP
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 10
  failureThreshold: 24

livenessProbe:
  httpGet:
    path: /actuator/health/liveness
    port: http
    scheme: HTTP
  initialDelaySeconds: 0
  periodSeconds: 30
  timeoutSeconds: 10
  successThreshold: 1
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /actuator/health/readiness
    port: http
    scheme: HTTP
  initialDelaySeconds: 0
  periodSeconds: 15
  timeoutSeconds: 10
  successThreshold: 1

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: null

ingress:
  enabled: true
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/use-forwarded-headers: "true"
  hosts:
    - host: <ingress-host>                       # unigate 전용 host (발급 필요)
      paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: unigate-svc
              port:
                number: 80
  tls:
    - secretName: ssl-common
      hosts:
        - <ingress-host>

# otel javaagent 주입은 토이 범위에서 기본 비활성 (필요 시 enabled: true + 이미지 지정)
javaOpts: "-Xms512m -Xmx1280m"

otelAgent:
  enabled: false

env:
  SPRING_PROFILES_ACTIVE: alpha

tmpVolume:
  enabled: true
  mountPath: /app/tmp
  subPath: null
  readOnly: false
  persistentVolumeClaim:
    create: true
    name: null
    accessModes:
      - ReadWriteOnce
    storageClassName: null
    resources:
      requests:
        storage: 1Gi

config:
  enabled: false

# 민감값은 values-alpha.secret.yaml 에서 주입 (이 파일엔 비워둠)
secrets:
  enabled: true
  data: {}

nodeSelector: {}
tolerations: []
affinity: {}
