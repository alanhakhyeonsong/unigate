# alpha 오버레이 — 비민감 값만. 실제 좌표(namespace · ingress host · registry)는
# 배포 스크립트가 gitignore 된 좌표 파일에서 읽어 --set 으로 주입한다.
#
# 배포: deploy/deploy-alpha.sh gateway

replicaCount: 1

imagePullSecrets:
  - name: harbor-pull

# ⚠️ 이 클러스터는 공용이고 **이미 포화 상태**다(2026-07-28 실측: worker 3대 CPU 94~99%,
#    메모리 84~97%). requests 를 원안(250m/1Gi)대로 두면 파드가 Pending 에서 멈춘다:
#      0/4 nodes are available: 1 unschedulable, 2 Insufficient cpu, 2 Insufficient memory
#    그래서 스케줄이 되도록 요청을 낮췄다. limits 는 남겨 두어 필요할 때 쓸 수 있게 한다.
#
#    ⚠️ 대가: request 가 낮으면 QoS 가 Burstable 이라 노드가 압박받을 때 evict 대상이 되기 쉽고,
#    부하 시 CPU throttling 이 실제 용량을 가릴 수 있다. **부하테스트 수치를 앱 성능으로 읽으려면
#    노드 여유를 먼저 확보해야 한다.**
# ⚠️ requests 를 실사용에 맞춰 더 낮췄다(2026-07-28 실측: gateway 파드 실사용 **CPU 4m**).
#
# 이 클러스터의 CPU 는 **물리적으로 부족한 게 아니라 예약만 꽉 차 있다** —
# 노드 CPU 실사용은 6~8% 인데 requests 로는 94~99% 가 잡혀 있다(다른 워크로드의 over-request).
# 그래서 requests 를 낮추면 스케줄이 되고, 실제 부하 시에는 limit 까지 쓸 수 있다.
# 노드에 7코어 이상이 유휴라 throttling 도 걸리지 않는다.
#
# 메모리는 성격이 다르다 — 실사용도 61~87% 라 진짜로 쓰이고 있다. 그래서 memory request 는
# 낮추지 않았다. **스케일 상한을 정하는 것은 CPU 가 아니라 메모리다.**
resources:
  requests:
    cpu: 50m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 1536Mi

# 힙을 limit 안쪽으로 낮춘다. metaspace·스레드 스택·direct buffer 가 힙 밖에서 더 쓰므로
# limit 과 힙을 같게 두면 OOMKill 이 난다.
javaOpts: "-Xms256m -Xmx1024m"

# HPA 를 켠다. 상한 4는 임의값이 아니라 **메모리에서 나온 수**였다 —
# 2026-07-28 당시 파드를 받을 수 있는 노드가 worker-node-1 하나뿐이고(다른 둘은 CPU 예약이
# 꽉 찼다), 그 노드의 메모리 여유가 2.33Gi 라 512Mi × 4 가 상한이었다.
#
# 📌 **2026-08-02 관찰: 그 전제는 더 이상 사실이 아니다.** 노드가 한 대 늘고(worker-node-3)
#    예약도 풀려 200m/512Mi 기준 41개를 받을 수 있다. `topologySpreadConstraints` 로
#    8개를 2/3/3 으로 분산 배치하는 것도 실제로 확인했다(`loadtest/SCENARIOS.md`).
#
#    그럼에도 **여기 값은 올리지 않았다.** 이 클러스터는 공용이고 여유는 다른 워크로드에 따라
#    다시 줄어든다. 부하 창에서만 올리는 편이 안전하므로 상향은 부하테스트 오버레이
#    (`values-alpha-loadtest.yaml`)에만 두고, 운영 기본값은 보수적으로 유지한다.
#    여유가 고착되면 그때 이 값을 올린다.
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 60
  targetMemoryUtilizationPercentage: null
  behavior:
    scaleUp:
      # 부하가 오르면 즉시 따라간다. 안정화 창 0 = 직전 관측을 그대로 쓴다.
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 2
          periodSeconds: 30
      selectPolicy: Max
    scaleDown:
      # k6 램프다운처럼 부하가 계단식으로 빠질 때 줄였다 늘렸다 하지 않도록 길게 잡는다.
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60

# replica 가 2 이상이 되므로 켠다. minAvailable 1 이면 드레인 시 최소 1개는 남는다.
podDisruptionBudget:
  enabled: true
  minAvailable: 1

# ⚠️ prometheus.io/scrape 를 켜지 않았다. 두 앱 모두 /actuator/prometheus 를
#    **의도적으로 인증 뒤에** 두고 있어(SecurityConfig), 애노테이션만 달면 스크랩이 401 로 실패한다.
#    "애노테이션이 있으니 수집되고 있다" 는 착각이 관측성 공백보다 나쁘다.
#    해결하려면 management.server.port 를 분리하고 그 포트를 네트워크 정책으로 가려야 한다 —
#    probe 포트까지 함께 옮겨야 해서 별도 작업으로 남긴다.
podAnnotations: {}

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # BFF 라 브라우저 쿠키가 실린다. 실제 클라이언트 IP 가 rate limit 키(미인증 시)이므로
    # forwarded 헤더를 신뢰해야 파드 IP 하나로 뭉뚱그려지지 않는다.
    nginx.ingress.kubernetes.io/use-forwarded-headers: "true"
    # 로그인 리다이렉트 왕복에서 Keycloak 세션 쿠키가 커질 수 있다.
    nginx.ingress.kubernetes.io/proxy-buffer-size: "16k"
  hosts:
    # host 는 --set 으로 주입한다. 비어 있으면 렌더가 실패하도록 라이브러리에서 막아 뒀다.
    - host: ""
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: ssl-common
      hosts: []

env:
  SPRING_PROFILES_ACTIVE: alpha
  # 클러스터 내부 통신은 **같은 네임스페이스의 짧은 이름**으로 지정한다.
  # FQDN(`...svc.cluster.local`)을 쓰면 네임스페이스가 값에 박혀 실제 좌표가 커밋된다.
  # 짧은 이름은 어느 네임스페이스에 배포하든 그대로 동작한다.
  IAM_URI: "http://unigate-iam-svc"
  DOWNSTREAM_DEMO_URI: "http://unigate-demo-be-svc"
  DOWNSTREAM_BILLING_URI: "http://unigate-demo-billing-svc"
  # 나머지(KEYCLOAK_ISSUER_URI · DB · Valkey · CORS origin · UNIGATE_FRONTEND_BASE_URI)는
  # 전부 차트 밖 Secret 으로 들어간다.
  #
  # ⚠️ `UNIGATE_FRONTEND_BASE_URI` 를 빠뜨리면 **로그인은 성공하는데 화면이 안 뜬다.**
  #    착지가 게이트웨이 루트(`/`)가 되고 거기엔 FE 가 없어 401 이다. 기동은 정상이고
  #    로그도 깨끗해서, 원인을 Keycloak 의 redirectUris 로 오해하기 쉽다.
  #    FE 를 분리한 이 배포에서는 **CORS origin 과 짝으로** 반드시 함께 넣는다.
