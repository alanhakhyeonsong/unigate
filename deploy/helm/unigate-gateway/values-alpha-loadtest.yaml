# 부하테스트 전용 오버레이 — **운영 설정이 아니다.**
#
# 사용:
#   deploy/deploy-alpha.sh --overlay deploy/helm/unigate-gateway/values-alpha-loadtest.yaml gateway
#   (테스트가 끝나면 오버레이 없이 다시 배포해 원래 값으로 되돌린다)
#
# ── 왜 이 파일이 필요한가 ──────────────────────────────────────────────────────
# 게이트웨이의 rate limit 키는 인증 시 `sub` 다. 즉 부하를 아무리 올려도 사용자 하나당
# 초당 5 요청에서 끊기고, 나머지는 429 로 튕겨 **애플리케이션에 도달하지 않는다.**
# 그 상태로는 CPU 가 오르지 않아 HPA 가 반응하지 않고, 측정되는 것은 애플리케이션 용량이
# 아니라 Valkey 토큰버킷의 처리량뿐이다.
#
# 그래서 "보호 장치가 어디서 끊는가"(시나리오 A)와 "앱이 얼마를 처리하는가"(시나리오 B)를
# 나누고, 후자에서만 한도를 올린다.
#
# ⚠️ 이 오버레이로 배포된 동안 게이트웨이는 **사실상 무방비**다. 외부에 열려 있는 환경에서는
#    테스트 창을 짧게 잡고 끝나면 즉시 되돌린다.

env:
  SPRING_PROFILES_ACTIVE: alpha
  IAM_URI: "http://unigate-iam-svc"
  DOWNSTREAM_DEMO_URI: "http://unigate-demo-be-svc"

  # 전역 rate limit 완화 (기본: 5 / 10 / 1)
  RATELIMIT_REPLENISH_RATE: "10000"
  RATELIMIT_BURST_CAPACITY: "20000"
  RATELIMIT_REQUESTED_TOKENS: "1"

  # 가입 전용 버킷도 함께 올린다 — 가입 경로를 부하 대상에 넣을 경우를 위해서다.
  RATELIMIT_REGISTER_REPLENISH_RATE: "1000"
  RATELIMIT_REGISTER_BURST_CAPACITY: "5000"
  RATELIMIT_REGISTER_REQUESTED_TOKENS: "1"

  # 부하 중 트레이싱 100% 는 그 자체가 오버헤드이자 측정 왜곡이다.
  # 낮춰서 앱 용량을 보되, traceId 상관관계가 필요한 검증은 이 프로파일로 하지 않는다.
  TRACING_SAMPLING_PROBABILITY: "0.05"

# ⚠️ maxReplicas 는 **메모리에서 나온 수**다(2026-07-28 실측).
#
# 파드를 받을 수 있는 노드가 worker-node-1 하나뿐이고(나머지 둘은 CPU 예약이 꽉 찼다),
# 그 노드의 메모리 여유가 2.33Gi 라 512Mi × 4 가 상한이다.
# 이보다 크게 잡으면 늘어난 파드가 Pending 으로 쌓이기만 하고, 그 상태는 "용량 한계" 처럼
# 보이지만 실제로는 **스케줄 실패**다 — 둘을 구분하려면 상한을 실제 수용량에 맞춰야 한다.
#
# 노드 여유가 늘면 이 값을 올린다. 다만 파드가 전부 같은 노드에 몰리므로
# 노드 분산 효과는 이 구성으로 측정할 수 없다.
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 60
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 4
          periodSeconds: 15
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 180
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
