# 부하테스트 전용 오버레이 — **운영 설정이 아니다.**
#
# 사용:
#   deploy/deploy-alpha.sh --overlay deploy/helm/unigate-gateway/values-alpha-loadtest.yaml gateway
#   (테스트가 끝나면 오버레이 없이 다시 배포해 원래 값으로 되돌린다)
#
# ── 왜 이 파일이 필요한가 ──────────────────────────────────────────────────────
# 게이트웨이의 rate limit 키는 인증 시 `sub` 다. 즉 부하를 아무리 올려도 사용자 하나당
# 초당 5 요청에서 끊기고, 나머지는 429 로 튕겨 **애플리케이션에 도달하지 않는다.**
# 그 상태로는 CPU 가 오르지 않아 HPA 가 반응하지 않고, 측정되는 것은 애플리케이션 용량이
# 아니라 Valkey 토큰버킷의 처리량뿐이다.
#
# 그래서 "보호 장치가 어디서 끊는가"(시나리오 A)와 "앱이 얼마를 처리하는가"(시나리오 B)를
# 나누고, 후자에서만 한도를 올린다.
#
# ⚠️ 이 오버레이로 배포된 동안 게이트웨이는 **사실상 무방비**다. 외부에 열려 있는 환경에서는
#    테스트 창을 짧게 잡고 끝나면 즉시 되돌린다.

env:
  SPRING_PROFILES_ACTIVE: alpha
  IAM_URI: "http://unigate-iam-svc"
  DOWNSTREAM_DEMO_URI: "http://unigate-demo-be-svc"

  # 전역 rate limit 완화 (기본: 5 / 10 / 1)
  RATELIMIT_REPLENISH_RATE: "10000"
  RATELIMIT_BURST_CAPACITY: "20000"
  RATELIMIT_REQUESTED_TOKENS: "1"

  # 가입 전용 버킷도 함께 올린다 — 가입 경로를 부하 대상에 넣을 경우를 위해서다.
  RATELIMIT_REGISTER_REPLENISH_RATE: "1000"
  RATELIMIT_REGISTER_BURST_CAPACITY: "5000"
  RATELIMIT_REGISTER_REQUESTED_TOKENS: "1"

  # 부하 중 트레이싱 100% 는 그 자체가 오버헤드이자 측정 왜곡이다.
  # 낮춰서 앱 용량을 보되, traceId 상관관계가 필요한 검증은 이 프로파일로 하지 않는다.
  TRACING_SAMPLING_PROBABILITY: "0.05"

  # ── ⚠️ 스케일 상한을 정하는 것은 CPU·메모리가 아니라 **DB 커넥션**이다 ──────
  #
  # 노드 여유가 41개 파드를 받는다고 해서 8개로 올려도 된다는 뜻이 아니었다.
  # 공유 PostgreSQL 실측: max_connections=100 · superuser_reserved=3 → **일반 슬롯 97개**.
  # 풀 기본값(10)을 그대로 두면 게이트웨이만 8 × 10 = 80 을 잡는다.
  #
  # 2026-08-02 1차 시도에서 IAM(6 × 10 = 60)과 합쳐 140 이 되어 슬롯이 소진됐고,
  # **게이트웨이 파드 3개가 CrashLoopBackOff** 로 죽었다. 터진 곳은 런타임이 아니라
  # **Flyway 가 커넥션을 여는 부팅 시점**이라, 증상이 부하와 연결되지 않는다.
  #
  # 그래서 풀을 명시한다. 8 × 4 = 32 (IAM 30 과 합쳐 62, 여유 35).
  # initial 을 낮춰 두는 것은 **스케일아웃 순간에 몰려서 여는 것**을 줄이기 위해서다 —
  # HPA 가 파드 4개를 한꺼번에 띄우는 프로파일이라 그 순간이 가장 위험하다.
  SPRING_R2DBC_POOL_MAX_SIZE: "4"
  SPRING_R2DBC_POOL_INITIAL_SIZE: "2"

# ── requests — **부하테스트에서만 실사용에 맞춘다** ───────────────────────────
#
# ⚠️ `values-alpha.yaml` 의 `cpu: 50m` 을 여기서 되돌리는 이유가 이번 회차의 핵심이다.
#
# HPA 의 utilization 은 **실사용 ÷ request** 다. 지난 회차(2026-07-28)는 스케줄을 통과시키려고
# request 를 50m 까지 낮춘 상태로 측정했고, 그 결과 파드당 실사용 200m 이 곧 **400%/60%** 로
# 보였다. 상한 4에 막혀 replica 가 멈췄는데 같은 구간 응답은 p95 46ms · 실패 0.127% 로 멀쩡했다.
# 즉 **앱이 포화된 게 아니라 HPA 지표가 과민했던 것**이고, 그 회차는 용량을 재지 못했다.
#
# 200m 은 임의값이 아니라 그 회차의 실측(파드당 실사용 ≈ 200m = 400% × 50m)이다.
# 이러면 부하 시 utilization 이 100% 근처가 되어 target 60% 가 "실제로 바쁜 상태"를 가리킨다.
#
# ⚠️ 운영값(`values-alpha.yaml`)은 그대로 둔다. request 를 올리면 포화된 공용 클러스터에서
#    스케줄이 막힐 수 있고, 그건 부하 창에서만 감수할 위험이다.
resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 1536Mi

# ── 노드 분산 ─────────────────────────────────────────────────────────────────
#
# 지난 회차는 파드 4개가 **전부 worker-node-1 하나에** 있었다. 다른 노드는 CPU 예약이
# 꽉 차 스케줄 자체가 안 됐고, podAntiAffinity 를 걸면 아예 Pending 이 됐다.
# 그래서 "스케일아웃이 동작하는가"는 봤지만 **노드 분산 효과는 측정할 수 없었다.**
#
# 2026-08-02 현재 노드가 한 대 늘고(worker-node-3) 예약도 풀려, 200m/512Mi 기준
# 41개를 받을 수 있다. 이제 분산을 실제로 걸 수 있다.
#
# ⚠️ `ScheduleAnyway` 를 쓴다. `DoNotSchedule` 은 균등을 강제하지만 노드 여유가 어긋나는
#    순간 Pending 이 쌓이고, 그 상태는 "용량 한계" 와 구분되지 않는다 — 지난 회차에
#    podAntiAffinity(required)로 겪은 것과 같은 함정이다. 여기서 재려는 것은 스케줄러의
#    강제력이 아니라 **분산됐을 때 트래픽이 실제로 고르게 가는가** 다.
#
# labelSelector 는 생략한다 — 라이브러리 차트가 이 앱의 selectorLabels 로 채운다.
# (셀렉터 없는 제약은 에러가 아니라 무효라서, 빠뜨리면 분산이 켜진 것처럼 보이고 실제로는 안 걸린다.)
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway

# ⚠️ maxReplicas 는 **노드 수용량에서 나온 수**다.
#
# 지난 회차의 4는 "worker-node-1 의 메모리 여유 2.33Gi ÷ 512Mi" 였다. 그 제약이 풀렸으므로
# 8로 올린다(200m × 8 = 1.6 core · 512Mi × 8 = 4Gi — 여유 노드 3대에 충분).
# 상한을 수용량보다 크게 잡으면 늘어난 파드가 Pending 으로 쌓이고, 그 상태는 "용량 한계" 처럼
# 보이지만 실제로는 **스케줄 실패**다 — 둘을 구분하려면 상한을 실제 수용량 안에 둬야 한다.
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 8
  targetCPUUtilizationPercentage: 60
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 4
          periodSeconds: 15
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 180
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
