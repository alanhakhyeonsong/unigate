spring:
  application:
    name: unigate-iam
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  # ── Virtual Thread (Phase 8) ────────────────────────────────────────────
  # gateway 에서는 **켜지 않는다**(CLAUDE.md §1.3 — SCG 가 WebFlux 전용이라 Reactive 와 경쟁).
  # 여기서는 켠다. Servlet 스택이고 Keycloak Admin client·JDBC 가 전부 블로킹이라,
  # 요청당 플랫폼 스레드를 쓰면 스레드풀이 곧 한계가 된다. VT 는 블로킹 호출 시 캐리어 스레드를
  # 반납하므로 같은 코드로 동시성이 크게 올라간다.
  #
  # ⚠️ VT 의 함정: `synchronized` 블록 안에서 블로킹하면 캐리어 스레드가 **pin** 되어 이점이 사라진다.
  # (JDK 21 기준. JDK 24+ 에서 개선됐지만 이 프로젝트는 21 이다.) 커넥션 풀·라이브러리가
  # synchronized 를 쓰는지 확인해야 한다.
  threads:
    virtual:
      enabled: true

  # ── 환경별 접속 좌표는 여기 두지 않는다 ──────────────────────────────────
  # DataSource(`spring.datasource`)와 Keycloak 접속(`unigate.iam.keycloak`)은
  # **프로파일 파일**이 소유한다 — `application-local.yml` / `application-alpha.yml`.
  # gateway 와 같은 규칙이다.
  #
  # 왜 공통에 기본값을 두지 않나: 공통에 로컬 기본값을 적어두면 alpha 에서 환경변수 주입을
  # 빠뜨렸을 때 **실패하지 않고 localhost 를 보며 뜬다.** 오설정이 기동 실패가 아니라
  # "왜 데이터가 안 보이지"로 나타나 발견이 한참 늦는다.

  # ── RFC 9457 Problem Detail (Phase 8e) ─────────────────────────────────
  # 켜지 않으면 검증 실패(400)·미지원 메서드(405) 등이 Spring 기본 에러 본문으로 나가,
  # 컨트롤러가 직접 만드는 ProblemDetail(409 등)·보안 핸들러(401/403)와 형식이 갈린다.
  # gateway 의 `spring.webflux.problemdetails.enabled` 와 짝이 되는 MVC 쪽 설정이다.
  mvc:
    problemdetails:
      enabled: true

  # ── JPA (블로킹이 정상이다) ──────────────────────────────────────────────
  # gateway 의 R2DBC 와 달리 영속성 컨텍스트·지연로딩·더티체킹이 **있다**.
  jpa:
    hibernate:
      # 스키마는 Flyway 가 소유한다. Hibernate 가 손대면 마이그레이션과 이중 관리가 된다.
      ddl-auto: validate
    open-in-view: false   # 뷰 렌더링 중 지연로딩(=예측 불가한 쿼리)을 막는다. 트랜잭션은 서비스에서 닫는다.
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

# ── Keycloak Admin 접속 (Phase 8c) ───────────────────────────────────────
# ⚠️ 게이트웨이의 OIDC client 와 **다른 client** 를 쓴다. 게이트웨이는 로그인용(`unigate-client`),
# 여기는 관리용(`unigate-iam`, service account)이다. 분리하는 이유는 blast radius 축소다 —
# 관리 자격증명이 유출돼도 로그인 흐름은 무사하고, 그 반대도 마찬가지다
# (IAM_PLATFORM_DECISION.md §14).
#
# service account 에는 realm-management 의 manage-users/view-users/query-users 만 준다.
# realm-admin 전체를 주면 client·realm 설정까지 바꿀 수 있어 과잉 권한이다.
#
# 📌 접속 좌표(`unigate.iam.keycloak.server-url` · `realm` · `client-id` · `client-secret`)는
# **프로파일 파일**에 있다 — `application-local.yml`(realm=test) / `application-alpha.yml`(realm=unigate).
# 설계 설명은 환경과 무관하므로 여기 남기고, 값만 환경별로 가져간다.
unigate:
  iam:
    # ── Resource Server (Phase 8f) ──────────────────────────────────────────
    # GW 가 relay 한 **사용자 JWT** 의 `aud` 에 이 값이 있어야 통과한다(IamSecurityConfig).
    #
    # ⚠️ 이 값은 realm 의 audience mapper(`iam-audience`)가 토큰에 넣어주는 값과 **정확히 같아야**
    # 한다. 다르면 모든 인증 요청이 401 이고, 응답만 봐서는 원인이 안 보인다
    # (docs/KEYCLOAK_REALM_SETUP.md §4.8). 매퍼는 GW 로그인 client 에 붙는다 — 토큰을 발급받는
    # 주체가 그쪽이기 때문이다.
    #
    # 값이 client-id 와 같은 것은 우연이 아니다: audience 는 "이 토큰의 수신자"이고 그 수신자가
    # IAM 이며, IAM 의 client 이름이 `unigate-iam` 이다. audience 전용 client 를 따로 만들지 않는다.
    security:
      expected-audience: ${IAM_EXPECTED_AUDIENCE:unigate-iam}

    # ── outbox 워커 (Phase 8d · 9b) ─────────────────────────────────────────
    # 값 자체는 코드 기본값과 같지만 **명시해 둔다.** 설정 파일에 없는 값은 존재를 모르게 되고,
    # 장애 때 "폴링 주기를 어떻게 바꾸지" 를 코드에서 찾게 된다.
    outbox:
      polling:
        # 워커를 띄우지 않는 인스턴스(API 전용 노드)를 구성할 여지. 통합 테스트도 이걸로 끈다.
        enabled: ${IAM_OUTBOX_POLLING_ENABLED:true}
        # 기동 직후는 커넥션 풀·Flyway 가 안정되기 전이라 조금 기다린다.
        # 이후 주기는 **적응형**이라 설정값이 아니다(500ms~10s, OutboxPollingScheduler 참조).
        initial-delay-ms: ${IAM_OUTBOX_POLLING_INITIAL_DELAY_MS:10000}
      retention:
        # COMPLETED 레코드 정리. DEAD 는 지우지 않는다(사람이 봐야 할 것이므로).
        enabled: ${IAM_OUTBOX_RETENTION_ENABLED:true}
        # 벌크 DELETE 라 부하가 있다 → 시각을 고정한다. fixedDelay 는 기동 시점에 따라 옮겨 다닌다.
        cron: ${IAM_OUTBOX_RETENTION_CRON:0 30 4 * * *}

    # ── 약관 정책 (Phase 8e) ────────────────────────────────────────────────
    # 이 값을 올리면 **기존 동의가 일제히 무효**가 되고 사용자에게 재동의를 받아야 한다
    # (ConsentRecord 는 버전과 시각을 함께 보관한다). 인프라 설정이 아니라 비즈니스 결정이므로
    # 배포 때 무심코 바꾸지 않도록 이름을 분명히 둔다.
    consent:
      current-tos-version: ${IAM_CURRENT_TOS_VERSION:v1}

server:
  shutdown: graceful
  # gateway(8080) 와 겹치지 않게. 로컬에서 둘을 동시에 띄운다.
  port: ${IAM_SERVER_PORT:8090}

lifecycle:
  timeout-per-shutdown-phase: 20s

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  # GW 가 보낸 traceparent 를 이어받아 같은 trace 로 묶이게 한다.
  # 이게 없으면 GW 구간과 IAM 구간이 별개 trace 로 쪼개진다.
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
    propagation:
      produce: W3C
      consume: W3C,B3,B3_MULTI
