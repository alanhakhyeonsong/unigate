# 샘플 FE 콘솔 정적 서빙 설정.
#
# ⚠️ 기본 nginx.conf 를 쓰지 않고 통째로 대체한다. 파드가 `readOnlyRootFilesystem: true` 로 뜨기
#    때문이다 — nginx 는 기본적으로 `/var/cache/nginx` 와 `/var/run/nginx.pid` 에 쓰려 하고,
#    루트가 읽기전용이면 **기동 즉시 "Permission denied" 로 죽는다.** 쓰기 대상을 전부 `/tmp`
#    (emptyDir 마운트)로 옮겨야 읽기전용 루트와 공존한다.

worker_processes auto;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # 쓰기가 발생하는 경로를 전부 /tmp 로. 하나라도 빠지면 그 기능을 처음 쓰는 요청에서만 터진다
  # (기동은 성공하고 특정 요청에서 502) — 증상이 늦게 나타나 원인을 찾기 어렵다.
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path       /tmp/proxy_temp;
  fastcgi_temp_path     /tmp/fastcgi_temp;
  uwsgi_temp_path       /tmp/uwsgi_temp;
  scgi_temp_path        /tmp/scgi_temp;

  sendfile      on;
  tcp_nopush    on;
  keepalive_timeout 65;

  # 실제 클라이언트 IP 는 ingress 가 X-Forwarded-For 로 넘긴다. 로그에 남겨야
  # 부하테스트 중 어느 경로가 눌렸는지 추적된다.
  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for"';
  access_log /dev/stdout main;
  error_log  /dev/stderr warn;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/javascript application/wasm;
  gzip_min_length 1024;

  server {
    # nginx-unprivileged 기본 포트. 1024 미만은 비특권 프로세스가 bind 할 수 없다.
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 이 FE 는 토큰을 갖지 않지만(BFF 구조), 정적 호스트 자체의 표면은 줄여 둔다.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # k8s probe 용. SPA fallback 보다 **위에** 둬야 한다 — 아래에 두면 fallback 이 먼저 잡아
    # index.html 을 200 으로 돌려주고, probe 는 "앱이 뜬 것"과 "SPA 가 404 를 삼킨 것"을 구분 못 한다.
    location = /healthz {
      access_log off;
      add_header Content-Type text/plain;
      return 200 'ok';
    }

    # 런타임 주입 설정. entrypoint 가 envsubst 로 /tmp 에 생성한다.
    #
    # ⚠️ 캐시를 반드시 끈다. 이 파일이 캐시되면 게이트웨이 주소를 바꿔 재배포해도
    #    브라우저가 **옛 주소를 계속 본다** — 증상은 "배포했는데 안 바뀐다" 뿐이라 오진하기 쉽다.
    location = /config.js {
      alias /tmp/config.js;
      add_header Cache-Control "no-store, no-cache, must-revalidate" always;
      default_type application/javascript;
    }

    # 해시가 붙은 번들은 내용이 바뀌면 이름도 바뀌므로 길게 캐시해도 안전하다.
    location /assets/ {
      expires 1y;
      add_header Cache-Control "public, immutable";
    }

    # SPA fallback — 클라이언트 라우팅 경로(/admin 등)로 직접 들어와도 index.html 을 준다.
    location / {
      try_files $uri $uri/ /index.html;
    }

    # index.html 은 캐시하지 않는다. 캐시되면 새 번들 해시를 가리키는 문서가 갱신되지 않아
    # 배포가 반영되지 않는다.
    location = /index.html {
      add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }
  }
}
