[versions]
kotlin = "2.1.21"
jackson-module-kotlin = "2.19.2"
kotlin-logging = "3.0.5"
kotest = "5.8.0"
mockk = "1.14.6"
springmockk = "5.0.1"
junit-platform-launcher = "1.12.2"
spring-boot = "3.5.4"
spring-cloud = "2025.0.0"
kotlinx-coroutines = "1.10.2"
postgresql = "42.6.0"
flyway = "11.4.1"
archunit = "1.3.0"
testcontainers = "1.21.3"          # 통합 테스트 전용. Spring Boot 3.5.4 BOM 과 정렬. 로컬 전용(Docker 필요)

[libraries]
# --- Kotlin / Jackson / logging ---
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin" }
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect", version.ref = "kotlin" }
jackson-module-kotlin = { module = "com.fasterxml.jackson.module:jackson-module-kotlin", version.ref = "jackson-module-kotlin" }
jackson-datatype-jsr310 = { module = "com.fasterxml.jackson.datatype:jackson-datatype-jsr310", version.ref = "jackson-module-kotlin" }
kotlin-logging = { module = "io.github.microutils:kotlin-logging-jvm", version.ref = "kotlin-logging" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-reactor = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-reactor", version.ref = "kotlinx-coroutines" }

# --- Reactive Gateway (WebFlux 스택) ---
# NOTE: Spring Cloud 2025.0.0 에서 게이트웨이 스타터가
#   spring-cloud-starter-gateway -> spring-cloud-starter-gateway-server-webflux 로 리네이밍됨.
spring-cloud-starter-gateway-server-webflux = { module = "org.springframework.cloud:spring-cloud-starter-gateway-server-webflux" }
spring-boot-starter-webflux = { module = "org.springframework.boot:spring-boot-starter-webflux", version.ref = "spring-boot" }

# --- Security / OAuth2 (BFF + Token Relay) ---
spring-boot-starter-oauth2-client = { module = "org.springframework.boot:spring-boot-starter-oauth2-client", version.ref = "spring-boot" }
spring-boot-starter-oauth2-resource-server = { module = "org.springframework.boot:spring-boot-starter-oauth2-resource-server", version.ref = "spring-boot" }

# --- Session / Valkey (Redis Reactive) ---
spring-session-data-redis = { module = "org.springframework.session:spring-session-data-redis" }
spring-boot-starter-data-redis-reactive = { module = "org.springframework.boot:spring-boot-starter-data-redis-reactive", version.ref = "spring-boot" }

# --- Resilience4j (Reactor) ---
spring-cloud-starter-circuitbreaker-reactor-resilience4j = { module = "org.springframework.cloud:spring-cloud-starter-circuitbreaker-reactor-resilience4j" }

# --- R2DBC (감사로그 / 클라이언트 메타) + Flyway(JDBC 마이그레이션) ---
spring-boot-starter-data-r2dbc = { module = "org.springframework.boot:spring-boot-starter-data-r2dbc", version.ref = "spring-boot" }
r2dbc-postgresql = { module = "org.postgresql:r2dbc-postgresql" }        # 버전은 Boot BOM 관리
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }   # Flyway 마이그레이션(JDBC)용
flyway-core = { module = "org.flywaydb:flyway-core", version.ref = "flyway" }
flyway-postgresql = { module = "org.flywaydb:flyway-database-postgresql", version.ref = "flyway" }

# --- Observability ---
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator", version.ref = "spring-boot" }
micrometer-registry-prometheus = { module = "io.micrometer:micrometer-registry-prometheus" }

# --- Validation ---
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation", version.ref = "spring-boot" }

# --- Testing ---
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test", version.ref = "spring-boot" }
kotlin-test-junit5 = { module = "org.jetbrains.kotlin:kotlin-test-junit5", version.ref = "kotlin" }
kotest-runner-junit5 = { module = "io.kotest:kotest-runner-junit5", version.ref = "kotest" }
kotest-assertions-core = { module = "io.kotest:kotest-assertions-core", version.ref = "kotest" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
springmockk = { module = "com.ninja-squad:springmockk", version.ref = "springmockk" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit-platform-launcher" }
archunit-junit5 = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }

# testcontainers (통합 테스트, 로컬 전용) — 버전은 bom 이 관리
testcontainers-bom = { module = "org.testcontainers:testcontainers-bom", version.ref = "testcontainers" }
testcontainers-postgresql = { module = "org.testcontainers:postgresql" }
testcontainers-junit = { module = "org.testcontainers:junit-jupiter" }
